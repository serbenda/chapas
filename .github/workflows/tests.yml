name: Tests

# Comprueba la física, los circuitos y la máquina en cada cambio
on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Física, circuitos y máquina
        run: node --test tests/*.test.mjs
