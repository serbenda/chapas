name: Publicar el juego

# Publica el juego en https://serbenda.github.io/chapas/ con cada cambio en main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar solo los archivos del juego
        run: |
          mkdir _site
          cp -r web/. _site/

      - name: Servir las fuentes desde la propia web (sin peticiones a Google)
        run: python3 scripts/fuentes_locales.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
