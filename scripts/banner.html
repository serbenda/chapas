<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Press+Start+2P&family=VT323&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; }
  body {
    background: #39404c;
    color: #f4f0e4;
    font-family: "VT323", monospace;
    position: relative;
  }
  canvas { position: absolute; inset: 0; }
  .logo { position: absolute; left: 420px; top: 74px; display: flex; flex-direction: column; gap: 18px; }
  h1 {
    margin: 0;
    font-family: "Press Start 2P", monospace; font-weight: 400;
    font-size: 38px; line-height: 1.3;
    text-shadow: 3px 0 0 #e5483a, -3px 0 0 #4fd6e8;
  }
  h1 span {
    display: block; font-size: 62px;
    background: linear-gradient(to bottom, #ffcf3a 0 25%, #ff8a2a 25% 50%, #e5483a 50% 75%, #c2338a 75%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(5px 5px 0 #14161c);
  }
  .rayas { display: grid; gap: 6px; width: 700px; }
  .rayas i { height: 7px; border-radius: 4px; }
  .rayas i:nth-child(1) { background: #ffcf3a; }
  .rayas i:nth-child(2) { background: #ff8a2a; width: 94%; }
  .rayas i:nth-child(3) { background: #e5483a; width: 88%; }
  .rayas i:nth-child(4) { background: #c2338a; width: 82%; }
  p { margin: 0; font-size: 34px; color: #4fd6e8; text-transform: uppercase; letter-spacing: .02em; }
  .tiza { position: absolute; left: 70px; bottom: 26px; font-family: "Gochi Hand", cursive; font-size: 30px; color: rgba(244,240,228,.75); }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  }
</style>
</head>
<body>
<canvas id="c" width="1280" height="400"></canvas>
<div class="logo">
  <h1>LA VUELTA<span>DE CHAPAS</span></h1>
  <div class="rayas"><i></i><i></i><i></i><i></i></div>
  <p>El juego de chapas del patio, ahora en tu móvil</p>
</div>
<div class="tiza">salida →</div>
<script>
  const c = document.getElementById("c"), x = c.getContext("2d");
  let s = 3;
  const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 26000; i++) { x.fillStyle = r() < .5 ? "rgba(20,24,32,.35)" : "rgba(170,178,190,.18)"; x.fillRect(r() * 1280, r() * 400, 1.4, 1.4); }
  // carretera de tiza
  function borde(off) {
    for (let p = 0; p < 3; p++) {
      x.beginPath();
      for (let t = 0; t <= 1.0001; t += .01) {
        const px = -40 + t * 460, py = 200 + Math.sin(t * 5.5) * 90 + off;
        t ? x.lineTo(px + (r() - .5) * 2, py + (r() - .5) * 2) : x.moveTo(px, py);
      }
      x.strokeStyle = "rgba(244,240,228,.55)"; x.lineWidth = 5 - p; x.lineCap = "round"; x.stroke();
    }
  }
  borde(-60); borde(60);
  function chapa(cx, cy, R, color, n) {
    x.save(); x.translate(cx, cy);
    x.fillStyle = "rgba(10,12,18,.45)"; x.beginPath(); x.arc(4, 6, R, 0, 6.283); x.fill();
    x.beginPath();
    for (let k = 0; k < 42; k++) { const a = k / 42 * 6.283, rr = k % 2 ? R * .9 : R; k ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(rr, 0); }
    x.closePath();
    const g = x.createRadialGradient(-R * .25, -R * .3, 2, 0, 0, R); g.addColorStop(0, "#f2f4f7"); g.addColorStop(1, "#8d949f");
    x.fillStyle = g; x.fill();
    x.fillStyle = color; x.beginPath(); x.arc(0, 0, R * .74, 0, 6.283); x.fill();
    x.fillStyle = "rgba(255,255,255,.92)"; x.beginPath(); x.arc(0, 0, R * .46, 0, 6.283); x.fill();
    x.fillStyle = "#1d1f24"; x.font = "bold " + R * .55 + "px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(n, 0, 1);
    x.fillStyle = "rgba(255,255,255,.28)"; x.beginPath(); x.ellipse(-R * .25, -R * .3, R * .38, R * .2, -.6, 0, 6.283); x.fill();
    x.restore();
  }
  chapa(110, 238, 34, "#3f7fe6", 4);
  chapa(205, 150, 40, "#35b26a", 3);
  chapa(300, 230, 46, "#e5483a", 2);
  chapa(372, 128, 30, "#ffcf3a", 1);
</script>
</body>
</html>
